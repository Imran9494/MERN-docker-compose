version: '3.8'
services:
  frontend:
    build: ./mern/frontend
    ports:
      - "5173:5173"
    networks:
      - mern_network
    environment:
      - REACT_APP_API_URL=http://backend:5050
  backend:
    build: ./mern/backend
    ports:
      - "5050:5050"
    networks:
      - mern_network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/employee_db
    depends_on:
      - mongodb
  mongodb:
    image: mongo:latest
    networks:
      - mern_network
    volumes:
      - mongo-data:/data/db
networks:
  mern_network:
    driver: bridge
volumes:
  mongo-data:
